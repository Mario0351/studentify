name: Deploy En Servidor Tomcat
on: 
  workflow_run:
    workflows: ["Test Spring project"]
    branches: 
      - main
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-22.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Copìar codigo en el contenedor
        uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Dar permisos de ejecucion a gradlew
        run: chmod +x gradlew

      - name: Compilar el prpoyecto
        run: ./gradlew build

      - name: Renombrar el war
        run: mv build/libs/studentify-1.0.0.war build/libs/studentify.war

      - name: Crear el fichero vockey.pem 
        run: echo "${{ secrets.vockey }}" >> vockey.pem

      - name: Dar permisos a vockey
        run: chmod 400 vockey.pem 

      - name: Copiar el war al servidor Tomcat
        run: scp -o StrictHostKeyChecking=no -i vockey.pem build/libs/studentify.war ubuntu@${{ secrets.DNS_PUBLICA_SERVIDOR }}:/opt/tomcat/webapps